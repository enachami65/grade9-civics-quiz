<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9 ශ්‍රේණිය පුරවැසි අධ්‍යාපනය - ප්‍රශ්නාවලිය</title>
  <style>
    :root {
      --bg-dark: #070b19;
      --card-dark: #0d152b;
      --option-dark: #101933;
      --border-cyan: #00d2ff;
      --gold: #f5b700;
      --text-white: #f4f7ff;
      --text-muted: #9fb0d6;
      --btn-prev: #2b3548;
      --btn-timer: #e09f00;
      --btn-reveal: #7e22ce;
      --btn-next: #15803d;
      --btn-auto: #0284c7;
      --correct: #16a34a;
      --wrong: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Iskoola Pota", "Nirmala UI", "Noto Sans Sinhala", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #101b3d 0%, var(--bg-dark) 65%);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .app-container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Header Card */
    .header-card {
      background: linear-gradient(135deg, #0b1329, #122044);
      border: 1.5px solid rgba(0, 210, 255, 0.65);
      box-shadow: 0 0 24px rgba(0, 210, 255, 0.16);
      border-radius: 14px;
      padding: 18px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .title-group h1 {
      font-size: 1.7rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .title-group p {
      color: var(--text-muted);
      font-size: 0.94rem;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .auto-pill {
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 700;
      border: 1px solid rgba(0, 210, 255, 0.45);
      background: rgba(2, 132, 199, 0.22);
      color: #bae6fd;
    }

    .auto-pill.paused {
      border-color: rgba(245, 183, 0, 0.45);
      background: rgba(245, 183, 0, 0.15);
      color: #fde68a;
    }

    .question-badge {
      background: #141d38;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 1.12rem;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Circular Countdown Timer */
    .timer-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .timer-circle {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #0b1226;
      border: 4px solid var(--border-cyan);
      box-shadow: 0 0 24px rgba(0, 210, 255, 0.35), inset 0 0 14px rgba(0, 210, 255, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      user-select: none;
    }

    .timer-circle:hover {
      transform: scale(1.04);
    }

    .timer-circle.danger {
      border-color: #ef4444;
      box-shadow: 0 0 28px rgba(239, 68, 68, 0.6), inset 0 0 14px rgba(239, 68, 68, 0.25);
    }

    .timer-number {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1;
      color: #ffffff;
    }

    .timer-label {
      font-size: 0.68rem;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .timer-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      min-height: 20px;
    }

    /* Question Card */
    .question-card {
      background: var(--card-dark);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 24px 26px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .question-text {
      font-size: 1.28rem;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .option-btn {
      background: var(--option-dark);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 15px 18px;
      text-align: left;
      color: var(--text-white);
      font-size: 1.06rem;
      cursor: pointer;
      transition: all 0.18s ease;
      line-height: 1.45;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--border-cyan);
      background: #162347;
      transform: translateY(-1px);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background: rgba(22, 163, 74, 0.28);
      border-color: #22c55e;
      color: #dcfce7;
      font-weight: 700;
    }

    .option-btn.wrong {
      background: rgba(220, 38, 38, 0.28);
      border-color: #ef4444;
      color: #fee2e2;
    }

    .status-banner {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(22, 163, 74, 0.14);
      border-left: 4px solid #22c55e;
      color: #dcfce7;
      font-size: 1rem;
      display: none;
    }

    .status-banner.show {
      display: block;
    }

    @media (max-width: 760px) {
      .options-grid {
        grid-template-columns: 1fr;
      }

      .title-group h1 {
        font-size: 1.3rem;
      }

      .question-text {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <div class="header-card">
      <div class="title-group">
        <h1>9 ශ්‍රේණිය පුරවැසි අධ්‍යාපනය</h1>
        <p>තෙවන වාර පළාත් ප්‍රශ්න පත්‍ර කෙටි ප්‍රශ්න 100 (ස්වයංක්‍රීය තත්පර 10 ක්‍රීඩාව)</p>
      </div>
      <div class="header-right">
        <span class="auto-pill" id="autoStatusBadge">▶ ඔටෝ ක්‍රීඩාව සක්‍රියයි</span>
        <div class="question-badge" id="questionCounter">ප්‍රශ්නය: 1 / 100</div>
      </div>
    </div>

    <!-- Countdown Timer -->
    <div class="timer-wrapper">
      <div class="timer-circle" id="timerCircle" title="ටයිමරය නැවත තත්පර 10 සිට ආරම්භ කිරීමට ක්ලික් කරන්න">
        <div class="timer-number" id="timerNumber">10</div>
        <div class="timer-label">SECONDS</div>
      </div>
      <div class="timer-hint" id="timerHint">තත්පර 10 ඇතුළත පිළිතුරක් ක්ලික් කරන්න</div>
    </div>

    <!-- Question & Options -->
    <div class="question-card">
      <div class="question-text" id="questionText"></div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="status-banner" id="statusBanner"></div>
    </div>
  </div>

  <script>
    // Complete 100 questions compiled from 2019 NWP, 2022/23 NWP, 2024 WP, 2024 NWP, and 2025 NWP
    const quizData = [
      { q: "01. යහපත් ලෙස කටයුතු කරන විනයගරුක පුද්ගලයෙකු සමාජයට දායාද කිරීමේ ප්‍රමුඛතම වගකීම .............................. සතු වේ.", options: ["පවුල", "පාසැල", "සමාජය", "රජය"], ans: 0 },
      { q: "02. රාජ්‍යයක හෝ සමාජයක සියලු දෙනාම අවනත විය යුතු රාජ්‍ය විසින් පනවනු ලබන සමස්ත රෙගුලාසි පද්ධතිය .............................. ලෙස සරලව හැඳින්විය හැකිය.", options: ["නීති", "රීති", "සිරිත් විරිත්", "ආචාර ධර්ම"], ans: 0 },
      { q: "03. මද්‍යසාර, මත්ද්‍රව්‍ය වැනි විවිධ සමාජ විරෝධී ක්‍රියා මැඩපැවැත්වීම හා වැරදිකරුවන් නීතියේ රැහැනට හසු කර දීම .............................. ප්‍රධාන කාර්යයයි.", options: ["අධිකරණයේ", "ත්‍රිවිධ හමුදාවේ", "පොලිසියේ", "සමථ මණ්ඩලයේ"], ans: 2 },
      { q: "04. ජනතාව අතර ඇතිවන සුළු ආරවුල් අධිකරණය වෙත නොගොස් නිරාකරණය කිරීම සඳහා පිහිටුවා ඇති විකල්ප ආයතන විශේෂය .............................. නමින් හඳුන්වයි.", options: ["ග්‍රාම නිලධාරි කාර්යාලය", "සමථ මණ්ඩලය", "දිසා අධිකරණය", "ප්‍රාදේශීය සභාව"], ans: 1 },
      { q: "05. කිසියම් ස්ථානයක ළමා හිංසනයක්, ළමා අපචාරයක් සිදුවන විට එය වළක්වා ගැනීම සඳහා .............................. යන ඍජු දුරකථන අංකය අමතා දැනුම්දිය හැකිය.", options: ["1919", "1929", "119", "118"], ans: 1 },
      { q: "06. සමාජයක මූලික තැනුම් ඒකකය .............................. ලෙස හඳුන්වයි.", options: ["සමාජය", "පවුල", "පාසල", "ගම"], ans: 1 },
      { q: "07. .............................. යනු මව විසින් සියවසේ ශ්‍රේෂ්ඨයකු බවට පත්කළ මහා පල් මෝඩයෙකි.", options: ["තෝමස් අල්වා එඩිසන්", "ඒබ්‍රහම් ලින්කන්", "ශ්‍රී ජවහර්ලාල් නේරු", "මහත්මා ගාන්ධි"], ans: 0 },
      { q: "08. \"ධම්මෝ භවේ රක්ඛති ධම්මචාරී\" යනු .............................. ආදර්ශ පාඨයයි.", options: ["ශ්‍රී ලංකා යුධ හමුදාවේ", "ශ්‍රී ලංකා නාවික හමුදාවේ", "ශ්‍රී ලංකා පොලිසියේ", "ශ්‍රී ලංකා ගුවන් හමුදාවේ"], ans: 2 },
      { q: "09. මිනිසාගේ බාහිර හැසිරීම හා ක්‍රියාකාරකම් පාලනය කිරීම .............................. සතු ගුණාංගයකි.", options: ["නීතිය", "පොලිසිය", "ආණ්ඩුක්‍රම ව්‍යවස්ථාව", "සංස්කෘතිය"], ans: 0 },
      { q: "10. ජනතාව අතර ඇතිවන සුළු ආරවුල් අධිකරණයට නොගොස් නිරාකරණය කර ගැනීම සඳහා .............................. නැමති ආයතන විශේෂය පිහිටුවා ඇත.", options: ["ග්‍රාමෝදය මණ්ඩල", "සමථ මණ්ඩල", "ගෙවල් කුලී මණ්ඩල", "පළාත් සභා"], ans: 1 },
      { q: "11. රටේ නීතිය හා සාමය සුරකිමින් සමාජ .............................. තහවුරු කිරීම පොලීසියේ ප්‍රධාන වගකීමකි.", options: ["සුරක්ෂිතතාව", "මර්ධනය", "වර්ධනය", "සංවර්ධනය"], ans: 0 },

      { q: "96. ශ්‍රී ලංකාවේ ප්‍රාදේශීය සංවර්ධනය සඳහා ඍජුවම දායකවන ආයතන විශේෂය ලෙස .............................. ආයතන හඳුනා ගත හැකිය.", options: ["පළාත් පාලන", "අධිකරණ", "ආරක්ෂක", "බැංකු"], ans: 0 },
      { q: "97. එම ආයතන පද්ධතිය මෙරට විධිමත්ව ස්ථාපිත කරන ලද්දේ .............................. පාලන යුගය තුළදීය.", options: ["බ්‍රිතාන්‍ය", "ලන්දේසි", "පෘතුග්‍රීසි", "සිංහල රාජ්‍ය"], ans: 0 },
      { q: "98. බ්‍රිතාන්‍ය යුගයේ විධිමත් පළාත් පාලන ආයතන පද්ධතියක් ස්ථාපිත කිරීමට බලපෑ ප්‍රධාන හේතුවක් වන්නේ:", options: ["ජන සංඛ්‍යා වර්ධනය හා නාගරීකරණය මත සුභසාධක සේවා සැපයීම", "විදේශ ආක්‍රමණ නැවැත්වීම", "මුදල් අච්චු ගැසීම", "අධිකරණ පිහිටුවීම"], ans: 0 },
      { q: "99. ප්‍රාදේශීය අවශ්‍යතා ඉටුකිරීම සඳහා නළ ළිං ඉදිකිරීම හා කසළ වර්ග කර බැහැර කිරීමේ බඳුන් තැබීම මගින් ඉටුවන සේවා වන්නේ:", options: ["පානීය ජල සම්පාදනය හා කසළ කළමනාකරණය", "මාර්ග ඉදිකිරීම හා පොලිස් සේවය", "බැංකු සේවා හා රක්ෂණ සේවා", "අධ්‍යාපන සේවා හා ප්‍රවාහන සේවා"], ans: 0 },
      { q: "100. පළාත් පාලන ආයතන මගින් ඉටුකරන සේවා සම්බන්ධයෙන් මහජනතාවගෙන් ඉටුවිය යුතු යුතුකමක් වන්නේ:", options: ["කලට වේලාවට නියමිත බදු ගෙවීම හා පොදු දේපළ සුරැකීම", "බදු ගෙවීම පැහැර හැරීම", "පොදු දේපළ අපවිත්‍ර කිරීම", "සේවා භාවිත නොකිරීම"], ans: 0 }
    ];

    let currentIndex = 0;
    let timeLeft = 10;
    let countdownId = null;
    let autoAdvanceId = null;
    let answered = false;
    let autoPlayEnabled = true;

    const questionCounterEl = document.getElementById("questionCounter");
    const autoStatusBadgeEl = document.getElementById("autoStatusBadge");
    const timerNumberEl = document.getElementById("timerNumber");
    const timerCircleEl = document.getElementById("timerCircle");
    const timerHintEl = document.getElementById("timerHint");
    const questionTextEl = document.getElementById("questionText");
    const optionsGridEl = document.getElementById("optionsGrid");
    const statusBannerEl = document.getElementById("statusBanner");

    function clearAllTimers() {
      if (countdownId) {
        clearInterval(countdownId);
        countdownId = null;
      }
      if (autoAdvanceId) {
        clearTimeout(autoAdvanceId);
        autoAdvanceId = null;
      }
      timerCircleEl.classList.remove("danger");
    }

    function updateAutoUi() {
      autoStatusBadgeEl.textContent = "▶ ඔටෝ ක්‍රීඩාව සක්‍රියයි";
      autoStatusBadgeEl.classList.remove("paused");
    }

    function scheduleAutoNext() {
      if (autoAdvanceId) {
        clearTimeout(autoAdvanceId);
        autoAdvanceId = null;
      }

      if (!autoPlayEnabled) {
        timerHintEl.textContent = "ඔටෝ ක්‍රීඩාව නවතා ඇත";
        return;
      }

      if (currentIndex < quizData.length - 1) {
        timerHintEl.textContent = "තත්පර 2.5 කින් ඊළඟ ප්‍රශ්නයට ඉබේම යයි...";
        autoAdvanceId = setTimeout(() => {
          loadQuestion(currentIndex + 1);
        }, 2500);
      } else {
        timerHintEl.textContent = "ප්‍රශ්න 100 සම්පූර්ණයි! තත්පර 3 කින් මුල් ප්‍රශ්නයට යයි...";
        autoAdvanceId = setTimeout(() => {
          loadQuestion(0);
        }, 3000);
      }
    }

    function startCountdown() {
      clearAllTimers();
      timeLeft = 10;
      timerNumberEl.textContent = timeLeft;
      timerHintEl.textContent = "තත්පර 10 ඇතුළත පිළිතුරක් ක්ලික් කරන්න";

      countdownId = setInterval(() => {
        timeLeft -= 1;
        timerNumberEl.textContent = Math.max(timeLeft, 0);

        if (timeLeft <= 3 && timeLeft > 0) {
          timerCircleEl.classList.add("danger");
        } else {
          timerCircleEl.classList.remove("danger");
        }

        if (timeLeft <= 0) {
          if (countdownId) {
            clearInterval(countdownId);
            countdownId = null;
          }
          timerCircleEl.classList.remove("danger");
          revealAnswer("කාලය අවසන් විය! නිවැරදි පිළිතුර:", null);
        }
      }, 1000);
    }

    function revealAnswer(prefixMessage, selectedIdx = null) {
      if (countdownId) {
        clearInterval(countdownId);
        countdownId = null;
      }
      timerCircleEl.classList.remove("danger");
      answered = true;

      const item = quizData[currentIndex];
      const optionBtns = optionsGridEl.querySelectorAll(".option-btn");

      optionBtns.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === item.ans) {
          btn.classList.add("correct");
        } else if (selectedIdx !== null && idx === selectedIdx) {
          btn.classList.add("wrong");
        }
      });

      statusBannerEl.textContent = `${prefixMessage} ${item.options[item.ans]}`;
      statusBannerEl.classList.add("show");

      scheduleAutoNext();
    }

    function loadQuestion(index) {
      clearAllTimers();
      currentIndex = index;
      answered = false;

      const item = quizData[currentIndex];
      questionCounterEl.textContent = `ප්‍රශ්නය: ${currentIndex + 1} / ${quizData.length}`;
      questionTextEl.textContent = item.q;
      optionsGridEl.innerHTML = "";
      statusBannerEl.classList.remove("show");
      statusBannerEl.textContent = "";

      item.options.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.textContent = optText;
        btn.addEventListener("click", () => {
          if (answered) return;
          if (idx === item.ans) {
            revealAnswer("නිවැරදි පිළිතුර:", idx);
          } else {
            revealAnswer("වැරදියි! නිවැරදි පිළිතුර:", idx);
          }
        });
        optionsGridEl.appendChild(btn);
      });

      startCountdown();
    }

    timerCircleEl.addEventListener("click", () => {
      if (!answered) {
        startCountdown();
      }
    });

    updateAutoUi();
    loadQuestion(0);
  </script>
</body>
</html>
